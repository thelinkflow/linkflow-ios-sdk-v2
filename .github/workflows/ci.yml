name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme LinkFlowSDK \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      # Pick whatever iPhone simulator the runner image actually ships instead of
      # hardcoding a model. The previous "iPhone 16" pin passed in April 2026 and
      # now fails on the Xcode 26.6 image, which ships iPhone 17 era devices only
      # — a hardcoded device name breaks on every runner image bump.
      - name: Select an iOS Simulator
        id: sim
        run: |
          cat > "${RUNNER_TEMP}/pick-sim.py" <<'PY'
          import json, subprocess, sys

          result = subprocess.run(
              ["xcrun", "simctl", "list", "devices", "available", "--json"],
              capture_output=True, text=True, check=True,
          )
          runtimes = json.loads(result.stdout)["devices"]

          iphones = [
              device
              for runtime, devices in runtimes.items() if "iOS" in runtime
              for device in devices if device["name"].startswith("iPhone")
          ]
          if not iphones:
              sys.exit("No iOS Simulator iPhone is available on this runner")

          # Last entry is the newest runtime/model the image provides.
          chosen = iphones[-1]
          # Human-readable line to stderr so it shows in the log without
          # becoming part of the captured value.
          print(f"Selected simulator: {chosen['name']} ({chosen['udid']})", file=sys.stderr)
          print(chosen["udid"])
          PY

          # Plain command substitution: `read` returns non-zero at EOF, which
          # aborts the step under the `bash -e` that Actions uses.
          UDID=$(python3 "${RUNNER_TEMP}/pick-sim.py")
          echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

      - name: Run tests (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme LinkFlowSDK \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate CocoaPods
        run: pod lib lint LinkFlowSDK.podspec --allow-warnings

  publish:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Push to CocoaPods Trunk
        run: pod trunk push LinkFlowSDK.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
