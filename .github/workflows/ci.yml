name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build (iOS Simulator)
        run: |
          xcodebuild build \
            -scheme LinkFlowSDK \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests (iOS Simulator)
        run: |
          xcodebuild test \
            -scheme LinkFlowSDK \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,OS=latest,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO

      - name: Validate CocoaPods
        run: pod lib lint LinkFlowSDK.podspec --allow-warnings

  publish:
    needs: build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Push to CocoaPods Trunk
        run: pod trunk push LinkFlowSDK.podspec --allow-warnings
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
